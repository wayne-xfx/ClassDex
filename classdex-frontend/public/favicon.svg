<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .navy{fill:#14224E;}
      .blue{fill:#3B6FE0;}
      .pale{fill:#DCE6FB;}
      .white{fill:#FFFFFF;}
    </style>
  </defs>

  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- back card -->
  <g transform="rotate(-10 256 256)">
    <rect x="146" y="126" width="220" height="160" rx="20" class="pale"/>
  </g>

  <!-- middle card -->
  <g transform="rotate(7 256 256)">
    <rect x="146" y="126" width="220" height="160" rx="20" class="blue"/>
  </g>

  <!-- front card -->
  <rect x="136" y="176" width="240" height="170" rx="20" class="navy"/>
  <rect x="164" y="212" width="128" height="14" rx="7" class="white"/>
  <rect x="164" y="240" width="96" height="14" rx="7" class="white" opacity="0.6"/>
  <rect x="164" y="268" width="112" height="14" rx="7" class="white" opacity="0.4"/>

  <!-- check badge -->
  <circle cx="340" cy="300" r="34" class="blue"/>
  <path d="M323 300 l12 13 l24 -28" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
